# 부하 테스트용(profile=mock): HikariCP 지표 노출. 운영 설정에는 노출하지 않는다.
management.endpoints.web.exposure.include=metrics
# Before/After 측정 조건을 고정하기 위해 풀 크기를 명시 (Hikari 기본값과 동일)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=HikariPool

# 외부 호출 지연(ms). openai는 실측(2~3초) 기준, flask·s3는 미실측 임시값이므로 실측 후 교체
mock.latency.openai-ms=2500
mock.latency.flask-ms=5000
mock.latency.s3-ms=300
